version: "3.8"

services:
  mongo:
    image: mongo
    ports:
    - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: anu
      MONGO_INITDB_ROOT_PASSWORD: anuakp
  
  mongo-express:
    image: mongo-express
    ports:
    - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: anu
      ME_CONFIG_MONGODB_ADMINPASSWORD: anuakp
      ME_CONFIG_MONGODB_URL: mongodb://anu:anuakp@mongo:27017/